name: Gerar Snake de Contribuições

on:
  schedule:
    # 12:00 UTC = 08:00 em Cuiabá (UTC-4)
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest

    steps:
      - name: Gerar as animações SVG das contribuições
        uses: Platane/snk@v3
        with:
          github_user_name: leoes91
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar as imagens na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
